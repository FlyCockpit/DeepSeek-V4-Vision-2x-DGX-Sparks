<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="DeepSeek Vision on 2x DGX Spark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="280" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="90" fill="#22d3ee" opacity="0.08"/>
  <circle cx="1160" cy="200" r="120" fill="#a78bfa" opacity="0.10"/>
  <!-- two nodes -->
  <rect x="860" y="88" width="88" height="88" rx="16" fill="#1e293b" stroke="url(#glow)" stroke-width="2"/>
  <rect x="1040" y="88" width="88" height="88" rx="16" fill="#1e293b" stroke="url(#glow)" stroke-width="2"/>
  <path d="M948 132 H1040" stroke="url(#glow)" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>
  <circle cx="994" cy="132" r="6" fill="#e0f2fe"/>
  <!-- eye -->
  <ellipse cx="994" cy="60" rx="34" ry="18" fill="none" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="994" cy="60" r="8" fill="#a5b4fc"/>
  <text x="64" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700">Give DeepSeek eyes</text>
  <text x="64" y="168" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Self-hosted vision for DeepSeek-V4-Flash on 2× DGX Spark</text>
  <text x="64" y="220" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">open playbook · open weights · OpenAI-compatible API</text>
</svg>
