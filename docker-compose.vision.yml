services:
  vllm-vision:
    image: ${DSPARK_VLLM_IMAGE:-dsv4-vision-vllm:0.1.1}
    pull_policy: never
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE}:/cache/huggingface
      # Editable install target — plugin edits need only a restart, never a rebuild
      - ${PLUGIN_DIR}:/opt/dsv4-vision-plugin
      - ${TOWER_DIR}:/tower:ro
      - ${CKPT_DIR}:/ckpt:ro
      - ${DSPARK_TMP_HOST:-${HOME}/.cache/dspark-tmp}:/tmp

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      VLLM_HOST_IP: "${VLLM_HOST_IP}"

      # --- vision encoder wiring (official HF release) ---
      DSV4_VISION_TOWER: /tower/deepencoder_v2_tower.safetensors
      DSV4_VISION_ADAPTER: "${DSV4_VISION_ADAPTER:-/ckpt/merged-004800-5af0c5.pt}"
      DSV4_VISION_N_VIEWS: "${DSV4_VISION_N_VIEWS:-1}"

      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_B12X_MOE: "1"

      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      CUTE_DSL_ARCH: "sm_121a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      FLASHINFER_WORKSPACE_BASE: /cache/huggingface/flashinfer
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "${NCCL_IB_HCA:-rocep1s0f1}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME:-enp1s0f1np1}"
      TP_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME:-enp1s0f1np1}"
      GLOO_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME:-enp1s0f1np1}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-3}"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25100}"

    command:
      - bash
      - -lc
      - >
        export PATH="/usr/local/cuda/bin:/usr/local/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/usr/local/cuda}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";
        exec /usr/local/bin/vllm serve /cache/huggingface/dsv4-0731-vision
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-0731-vision}
        --host ${VLLM_HOST:-0.0.0.0}
        --port ${VLLM_PORT:-8899}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype nvfp4_ds_mla
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-131072}
        --max-num-seqs ${MAX_NUM_SEQS:-4}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --enforce-eager
        --limit-mm-per-prompt '{"image":${MM_IMAGE_LIMIT:-8}}'
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --moe-backend flashinfer_b12x
        --generation-config vllm
        --trust-request-chat-template
        ${CHAT_TEMPLATE_FLAG:-}
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25100}
        ${HEADLESS:+--headless}
